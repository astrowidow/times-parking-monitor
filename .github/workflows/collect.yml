# 5分おきに満空を1回取得して data/log.csv に追記し、コミットする。
name: collect

on:
  schedule:
    # GitHub の cron は UTC。毎時ちょうどは混んで遅れやすいので2分ずらす。
    # 実際には数分〜十数分遅れることがあり、まれに飛ばされる（集計は site_time で重複を除くので問題ない）。
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 期限が来たら自分を無効にするため

concurrency:
  group: collect
  cancel-in-progress: false

env:
  END_DATE: "20261201"   # この日（日本時間）以降は記録せず、ワークフローを無効にする

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check end date
        id: end
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -ge "$END_DATE" ]; then echo "over=1" >> "$GITHUB_OUTPUT"; else echo "over=0" >> "$GITHUB_OUTPUT"; fi

      - name: disable after end date
        if: steps.end.outputs.over == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable collect --repo "$GITHUB_REPOSITORY"

      - uses: actions/checkout@v5
        if: steps.end.outputs.over == '0'

      # 取得に失敗しても error 列つきで記録するので、ここでは止めない
      - name: collect
        if: steps.end.outputs.over == '0'
        run: python3 collect.py || true

      - name: commit
        if: steps.end.outputs.over == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log.csv
          git commit -q -m "data: $(tail -1 data/log.csv | cut -d, -f2-4)" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
